# ProjectBuddy lane access (VITechnologies/projectbuddy#206), installed by Invoke-LaneBox.py configure-access.
# sshd keeps the first value it reads for most settings, and this file sorts before the other drop-ins.
# Only root may log in, only by public key, and only with the key that projectbuddy-lane-access.service
# writes to /run/projectbuddy-ssh/root at boot.
PasswordAuthentication no
KbdInteractiveAuthentication no
HostbasedAuthentication no
GSSAPIAuthentication no
PubkeyAuthentication yes
PubkeyAcceptedAlgorithms ssh-ed25519
AuthenticationMethods publickey
PermitRootLogin prohibit-password
AllowUsers root
AuthorizedKeysFile /run/projectbuddy-ssh/%u
AuthorizedKeysCommand none
AuthorizedPrincipalsFile none
TrustedUserCAKeys none
DisableForwarding yes
PermitTTY no
