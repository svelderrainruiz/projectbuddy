name: ci-assurance

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  coverage:
    # The literal job name "PR Coverage Gate / coverage" is required --
    # repo-standards-review's GATE:coverage:context rule looks for this
    # exact text.
    name: PR Coverage Gate / coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"

      - name: Install Test Dependencies
        shell: bash
        run: python -m pip install --upgrade pip==26.3 pytest==9.2.0 pytest-cov==7.1.0 pyyaml==6.0.3

      - name: Run Tests With Coverage
        shell: bash
        # Scoped to scripts/, the directory with real, assertion-based
        # pytest-based unit tests today (Convert-VipbJson.py; this repo's
        # separate Pester suite for Test-SbomArtifact.ps1 runs in its own
        # job below and isn't pytest-coverage-measurable). This repo's
        # remaining VM-provisioning and pipeline scripts need a live
        # VM/VIPM toolchain to exercise meaningfully and are validated via
        # real CI dispatch instead (see
        # REQ-008/REQ-009 in the wiki's Software-Requirements-Specification --
        # ephemerally copied to docs/requirements/srs.md only during an
        # active standards-assurance-scan.yml run, not a permanently
        # committed file) -- `--cov=.` across the
        # whole repo would silently and misleadingly dilute this honest,
        # real percentage with files no test here could ever cover.
        run: |
          pytest scripts/tests/ --cov=scripts --cov-report=xml:coverage.xml --cov-report=term-missing

      - name: Enforce Coverage Threshold
        shell: bash
        run: |
          python - <<'PY'
          from xml.etree import ElementTree

          threshold = 90.0
          root = ElementTree.parse("coverage.xml").getroot()
          percent = float(root.attrib["line-rate"]) * 100.0
          print(f"Measured line coverage (scripts/): {percent:.1f}%")
          if percent < threshold:
              raise SystemExit(f"Coverage threshold failed: {percent:.1f}% < {threshold:.1f}%")
          PY

      - name: Upload Coverage Evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-evidence
          path: coverage.xml

  peer-ask:
    # tools/peer/ask (projectbuddy-ask, #211): unit tests with a 100% line and branch gate.
    name: Peer Ask Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: tools/peer/ask/global.json

      - name: Test With Coverage
        shell: bash
        working-directory: tools/peer/ask
        run: |
          dotnet restore ProjectBuddy.PeerAsk.Tests --locked-mode --nologo
          dotnet test ProjectBuddy.PeerAsk.Tests --no-restore --nologo --settings coverage.runsettings \
            --collect:"XPlat Code Coverage" --results-directory "$RUNNER_TEMP/peer-ask-coverage"

      - name: Enforce 100% Line And Branch Coverage
        shell: bash
        run: |
          python3 - "$RUNNER_TEMP/peer-ask-coverage" <<'PY'
          import pathlib
          import sys
          from xml.etree import ElementTree

          report = next(pathlib.Path(sys.argv[1]).rglob("coverage.cobertura.xml"), None)
          if report is None:
              raise SystemExit("no projectbuddy-ask coverage report was produced")
          root = ElementTree.parse(report).getroot()
          line, branch = float(root.attrib["line-rate"]), float(root.attrib["branch-rate"])
          print(f"projectbuddy-ask coverage: line {line:.1%}, branch {branch:.1%}")
          if line < 1.0 or branch < 1.0:
              raise SystemExit("projectbuddy-ask coverage must be 100% line and branch")
          PY

  toolchain-smoke-test:
    # Calls this repo's own reusable toolchain-smoke-test.yml against
    # itself (REQ-008): proves scripts/Test-ToolchainPresence.ps1's real
    # CI-dispatch path actually runs in this repo's own CI, not just in a
    # hypothetical consumer's. `projectbuddy-ref: ${{ github.sha }}`
    # resolves dynamically to the exact commit under test on every run,
    # so this never needs a hardcoded SHA to keep up to date.
    name: Toolchain Smoke Test (self-check)
    uses: ./.github/workflows/toolchain-smoke-test.yml
    with:
      projectbuddy-ref: ${{ github.sha }}
      tool-names: "git,pwsh,python3,jq"
      runs-on-json: '"ubuntu-latest"'

  pester-tests:
    # REQ-009: real, assertion-based fixture tests for Test-SbomArtifact.ps1,
    # covering all 3 documented failure classes (integrity/build, policy,
    # reporting) plus the success path -- see
    # scripts/tests/Test-SbomArtifact.Tests.ps1's own header comment.
    # REQ-034/REQ-036 (ADR-0003): Get-VerifiedLUnitPackageStaging.Tests.ps1 and
    # Invoke-LUnitTests.Tests.ps1 cover the LUnit gate's pure, offline-
    # testable logic (SHA-256 package-integrity verification; the named-
    # waiver-only JUnit acceptance policy) -- not the real LabVIEW
    # execution, which `lunit-gate-windows.yml` live-dispatch-proves on
    # windows-2022.
    name: Pester Tests (Test-SbomArtifact.ps1, Install-VerifiedNugetPackage.ps1, LUnit gate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Pester
        shell: pwsh
        run: Install-Module -Name Pester -RequiredVersion 6.2.0 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Run Pester Tests
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion 6.2.0
          $config = New-PesterConfiguration
          $config.Run.Path = @('scripts/tests/Test-SbomArtifact.Tests.ps1', 'scripts/tests/Install-VerifiedNugetPackage.Tests.ps1', 'scripts/tests/Get-VerifiedLUnitPackageStaging.Tests.ps1', 'scripts/tests/Invoke-LUnitTests.Tests.ps1')
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

