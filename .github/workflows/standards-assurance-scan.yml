name: Standards Assurance Scan

on:
  workflow_dispatch: {}
  schedule:
    # Weekly: every Monday at 09:30 UTC (after standards-compliance-recheck's 09:00 slot).
    - cron: "30 9 * * 1"

permissions:
  contents: read

jobs:
  scan:
    name: Run repo-standards-review Assurance Pipeline
    # repo-standards-review is a private repo; this runner's ambient git/gh
    # credentials already have real, working read access to it (see
    # docs/architecture/standards-compliance.md). The wiki is public, so no
    # special credentials are needed to clone it.
    runs-on: [self-hosted, standards-review-local]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # See standards-compliance-recheck.yml's own comment: persisted
          # credentials here would hijack the unrelated repo-standards-review
          # clone below with this job's own scope-less token.
          persist-credentials: false

      - name: Assemble Scan Checkout (main repo + wiki specs)
        id: assemble
        shell: bash
        run: |
          set -euo pipefail

          # The SRS/RTM/Architecture Packet live in VITechnologies/projectbuddy's
          # wiki specifically (the authoritative, assessed repo -- per
          # operator decision, not the fork's own wiki, which doesn't exist),
          # not in this checkout -- copy them into the paths
          # repo-standards-review's scanner actually looks for. This is an
          # ephemeral, scan-time-only copy; the wiki remains the one real
          # source of truth and is never written back to here.
          rm -rf /tmp/projectbuddy-wiki-scan /tmp/projectbuddy-wiki-view
          wiki_url="https://github.com/VITechnologies/projectbuddy"
          git clone --quiet --depth 1 "$wiki_url.wiki.git" /tmp/projectbuddy-wiki-scan
          # The wiki may split each hub into linked ID and section pages.
          # Rebuild every governed hub in place from them (byte-identical for
          # an unsplit wiki); this fails closed if any page content would
          # drop out of the scan input. --strict also rejects, before anything
          # is written, piped, heading-anchor, and unresolved links, unlinked
          # ID mentions, and pages over the 16 KiB budget. --view writes a
          # display copy of the RTM, with Markdown links to the wiki pages,
          # for the job summary; it is not scan input.
          python3 scripts/Assemble-WikiSpec.py --wiki /tmp/projectbuddy-wiki-scan \
            --strict --max-page-bytes 16384 \
            --emit System-Requirements-Specification=/tmp/projectbuddy-wiki-scan/System-Requirements-Specification.md \
            --emit Software-Requirements-Specification=/tmp/projectbuddy-wiki-scan/Software-Requirements-Specification.md \
            --emit Requirements-Traceability-Matrix=/tmp/projectbuddy-wiki-scan/Requirements-Traceability-Matrix.md \
            --emit Architecture-Packet=/tmp/projectbuddy-wiki-scan/Architecture-Packet.md \
            --view Requirements-Traceability-Matrix=/tmp/projectbuddy-wiki-view/Requirements-Traceability-Matrix.md \
            --link-base "$wiki_url/wiki"

          mkdir -p docs/requirements
          cp /tmp/projectbuddy-wiki-scan/System-Requirements-Specification.md docs/requirements/syrs.md
          cp /tmp/projectbuddy-wiki-scan/Software-Requirements-Specification.md docs/requirements/srs.md
          cp /tmp/projectbuddy-wiki-scan/Requirements-Traceability-Matrix.md docs/requirements/rtm.md
          cp /tmp/projectbuddy-wiki-scan/Architecture-Packet.md docs/architecture/overview.md

          rm -rf /tmp/repo-standards-review-scan
          # Pinned to the exact SHA this repo's compliance stamp is assessed
          # against (docs/architecture/standards-compliance.md) -- a floating
          # clone here would silently let the scan drift from what the stamp
          # claims without anyone noticing. Bump this alongside the stamp,
          # never independently.
          git clone --quiet "https://github.com/svelderrainruiz/repo-standards-review.git" /tmp/repo-standards-review-scan
          git -C /tmp/repo-standards-review-scan checkout --quiet ba72187ce5f745a1ffea93536cf83982b747819a # v0.2.23

      - name: Run Assurance Pipeline
        id: scan
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/standards-scan-out
          python3 /tmp/repo-standards-review-scan/scripts/run_assurance.py "$PWD" \
            --profile release-gate --mode evidence-pack \
            --save-dir /tmp/standards-scan-out --output gate-scorecard \
            | tee /tmp/scan-summary.txt

          {
            echo "## Standards Assurance Scan"
            echo '```'
            cat /tmp/scan-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          score_file=$(find /tmp/standards-scan-out -name score.json | head -1)
          failed=""
          for gate in req arch cm coverage doc; do
            status="$(python3 -c "import json; print(json.load(open('$score_file'))['gates']['$gate']['status'])")"
            echo "${gate}_status=$status" >> "$GITHUB_OUTPUT"
            echo "$gate gate: $status"
            [[ "$status" == "PASS" ]] || failed="$failed $gate=$status"
          done
          echo "failed_gates=$failed" >> "$GITHUB_OUTPUT"

      # The wiki hubs list linked ID pages rather than table rows. Publish the
      # files this run scored as a generated, non-authoritative view for
      # whole-table review, even when a gate fails; edit the wiki pages, never
      # this output. The summary shows the RTM with its wikilinks rendered as
      # links to the wiki pages; the artifact holds the exact scored bytes.
      - name: Publish Assembled Specification View
        if: ${{ !cancelled() && steps.assemble.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Assembled Specification View"
            echo
            echo "Generated by this run from the wiki for whole-table review. It is not authoritative: edit the wiki pages, not this view. Links below open the wiki page that holds each row or section. The \`assembled-wiki-spec\` artifact holds the four files exactly as scored, with these SHA-256 hashes:"
            echo
            echo '```'
            sha256sum docs/requirements/syrs.md docs/requirements/srs.md docs/requirements/rtm.md docs/architecture/overview.md
            echo '```'
            echo
            echo "<details><summary>Requirements Traceability Matrix</summary>"
            echo
            cat /tmp/projectbuddy-wiki-view/Requirements-Traceability-Matrix.md
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Assembled Specification View
        if: ${{ !cancelled() && steps.assemble.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: assembled-wiki-spec
          path: |
            docs/requirements/syrs.md
            docs/requirements/srs.md
            docs/requirements/rtm.md
            docs/architecture/overview.md
          if-no-files-found: error

      - name: Fail If Any Required Gate Regressed
        if: steps.scan.outputs.failed_gates != ''
        shell: bash
        run: |
          echo "::error::One or more required gates regressed:${{ steps.scan.outputs.failed_gates }} -- all 5 were passing when this check was last widened (VITechnologies/projectbuddy, round-5 semantic audit). Check the wiki content or this scan's own copy step for a regression."
          exit 1
